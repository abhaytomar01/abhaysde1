<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TaskFlow - Modern Weekly Task & Schedule Manager based on Figma design." />
    <title>TaskFlow — To-Do List Mobile App</title>
    <!-- Google Fonts Poppins & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      /* Suppress Netlify Drawer & badge iframe overlays */
      iframe[src*="netlify"],
      iframe[id*="netlify"],
      iframe[class*="netlify"],
      div[id*="netlify"],
      div[class*="netlify-cdp"],
      netlify-drawer,
      [data-netlify-site-id] {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
        height: 0 !important;
        width: 0 !important;
        position: absolute !important;
        z-index: -9999 !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Immediately remove Netlify preview drawer or badge if injected into DOM
      (function() {
        const removeNetlifyElements = () => {
          const els = document.querySelectorAll('iframe[src*="netlify"], iframe[id*="netlify"], [class*="netlify-cdp"], netlify-drawer');
          els.forEach(el => el.remove());
        };
        const observer = new MutationObserver(removeNetlifyElements);
        observer.observe(document.documentElement, { childList: true, subtree: true });
        window.addEventListener('DOMContentLoaded', removeNetlifyElements);
        window.addEventListener('load', removeNetlifyElements);
      })();
    </script>
  </body>
</html>
