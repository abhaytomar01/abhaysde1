# Netlify Configuration for TaskFlow App
# Automatically configures build settings when deployed from GitHub

[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"

# Environment variables defaults (can be overridden in Netlify dashboard)
[build.environment]
  NODE_VERSION = "20"
  NETLIFY_DRAWER = "false"
  NETLIFY_DEPLOY_PREVIEW_DRAWER = "false"

# SPA routing: Redirect all routes to index.html with HTTP 200
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
